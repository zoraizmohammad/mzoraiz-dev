<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title description">
<title id="title">Autonomous pollination mission pipeline</title><desc id="description">Bounded autonomy services feed a deterministic thirteen-phase flight state machine with telemetry feedback and a safety abort path.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#244844"/></marker><filter id="lift" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#173936" flood-opacity=".13"/></filter><style>.k{font:700 13px Arial,sans-serif;letter-spacing:2px;fill:#6c7773}.h1{font:700 31px Arial,sans-serif;fill:#163633}.h2{font:700 17px Arial,sans-serif;fill:#163633}.s{font:400 13px Arial,sans-serif;fill:#66726e}.tiny{font:700 11px Arial,sans-serif;letter-spacing:1px;fill:#73807b}.panel{fill:#faf9f3;stroke:#9dada7;stroke-width:1.4}.green{fill:#dce8e1;stroke:#789289;stroke-width:1.4}.rose{fill:#f1dfd7;stroke:#bd806c;stroke-width:1.4}.gold{fill:#f2e6c9;stroke:#bb9550;stroke-width:1.4}.wire{fill:none;stroke:#244844;stroke-width:1.8;marker-end:url(#arrow)}.feedback{fill:none;stroke:#7c8d87;stroke-width:1.6;stroke-dasharray:6 6;marker-end:url(#arrow)}g&gt;rect{transition:fill .2s ease,stroke .2s ease,filter .2s ease}g:hover&gt;rect{fill:#fff;stroke:#c8735d;filter:url(#lift)}g:hover&gt;.h2{fill:#a85543}svg:hover .wire{stroke-width:2.3}@media(prefers-reduced-motion:no-preference){svg:hover .feedback{animation:feedback 1.2s linear infinite}@keyframes feedback{to{stroke-dashoffset:-24}}}</style></defs>
<rect width="1400" height="900" fill="#f2f1ea"/><text x="50" y="52" class="k">AUTONOMOUS POLLINATION MISSION</text><text x="50" y="91" class="h1">Hierarchical control &amp; perception pipeline</text><text x="50" y="120" class="s">Bounded agent recommendations inform — but never bypass — deterministic flight control and safety guards.</text>
<rect x="50" y="158" width="1300" height="292" class="panel"/><text x="78" y="190" class="k">01 · MISSION SERVICES</text>
<g><g transform="translate(78 216)"><rect class="panel" width="188" height="158"/><text x="20" y="34" class="tiny">ORCHESTRATE</text><text x="20" y="66" class="h2">Mission manager</text><text x="20" y="98" class="s">Initialise mission</text><text x="20" y="122" class="s">Monitor state</text></g><g transform="translate(290 216)"><rect class="green" width="188" height="158"/><text x="20" y="34" class="tiny">PERCEIVE</text><text x="20" y="66" class="h2">Vision engine</text><text x="20" y="98" class="s">Detect flowers</text><text x="20" y="122" class="s">Estimate confidence</text></g><g transform="translate(502 216)"><rect class="panel" width="188" height="158"/><text x="20" y="34" class="tiny">OPTIMISE</text><text x="20" y="66" class="h2">Route planner</text><text x="20" y="98" class="s">Greedy TSP</text><text x="20" y="122" class="s">Select next target</text></g><g transform="translate(714 216)"><rect class="panel" width="188" height="158"/><text x="20" y="34" class="tiny">NAVIGATE</text><text x="20" y="66" class="h2">Local controller</text><text x="20" y="98" class="s">Precision approach</text><text x="20" y="122" class="s">Hover alignment</text></g><g transform="translate(926 216)"><rect class="gold" width="188" height="158"/><text x="20" y="34" class="tiny">ACTUATE</text><text x="20" y="66" class="h2">Pollination</text><text x="20" y="98" class="s">Servo trigger</text><text x="20" y="122" class="s">3 s dwell</text></g><g transform="translate(1138 216)"><rect class="rose" width="184" height="158"/><text x="20" y="34" class="tiny">PROTECT</text><text x="20" y="66" class="h2">Safety &amp; recovery</text><text x="20" y="98" class="s">Timeout guards</text><text x="20" y="122" class="s">Abort + landing</text></g></g>
<path class="wire" d="M266 295h14"/><path class="wire" d="M478 295h14"/><path class="wire" d="M690 295h14"/><path class="wire" d="M902 295h14"/><path class="wire" d="M1114 295h14"/><path class="wire" d="M700 374v92"/><rect x="585" y="424" width="230" height="34" rx="17" fill="#f2f1ea"/><text x="700" y="446" text-anchor="middle" class="tiny">VALIDATED COMMANDS</text>
<rect x="50" y="486" width="1300" height="334" class="panel"/><text x="78" y="520" class="k">02 · DETERMINISTIC EXECUTION</text><text x="1322" y="520" text-anchor="end" class="s">13-phase finite state machine · 20 Hz control loop</text>
<g text-anchor="middle"><g transform="translate(78 550)"><rect class="panel" width="168" height="88"/><text x="84" y="30" class="tiny">STARTUP</text><text x="84" y="58" class="h2">Idle → Arming</text></g><g transform="translate(266 550)"><rect class="panel" width="168" height="88"/><text x="84" y="30" class="tiny">FLIGHT</text><text x="84" y="58" class="h2">Takeoff → Transit</text></g><g transform="translate(454 550)"><rect class="green" width="222" height="88"/><text x="111" y="30" class="tiny">PERCEPTION</text><text x="111" y="57" class="h2">Scan → Candidate</text><text x="111" y="76" class="s">→ Target lock</text></g><g transform="translate(696 550)"><rect class="gold" width="222" height="88"/><text x="111" y="30" class="tiny">INTERACTION</text><text x="111" y="57" class="h2">Descend → Align</text><text x="111" y="76" class="s">→ Pollinate</text></g><g transform="translate(938 550)"><rect class="panel" width="196" height="88"/><text x="98" y="30" class="tiny">RECOVERY</text><text x="98" y="57" class="h2">Ascend → Resume</text><text x="98" y="76" class="s">transit to next target</text></g><g transform="translate(1154 550)"><rect class="rose" width="168" height="88"/><text x="84" y="30" class="tiny">TERMINAL</text><text x="84" y="58" class="h2">Mission complete</text></g></g>
<path class="wire" d="M246 594h10"/><path class="wire" d="M434 594h10"/><path class="wire" d="M676 594h10"/><path class="wire" d="M918 594h10"/><path class="wire" d="M1134 594h10"/>
<path class="feedback" d="M1238 650v72H384V384"/><rect x="683" y="704" width="258" height="34" rx="17" fill="#f2f1ea"/><text x="812" y="726" text-anchor="middle" class="tiny">TELEMETRY + SENSOR FEEDBACK</text><path class="feedback" d="M1218 374v94h92v82"/><rect x="1124" y="447" width="170" height="34" rx="17" fill="#f2f1ea"/><text x="1209" y="469" text-anchor="middle" class="tiny">ABORT PATH</text>
<g transform="translate(78 674)"><circle cx="7" cy="7" r="7" fill="#214b48"/><text x="26" y="12" class="s">Pixhawk executes flight commands</text><circle cx="284" cy="7" r="7" fill="#d5aa50"/><text x="303" y="12" class="s">Raspberry Pi supervises mission state</text><circle cx="641" cy="7" r="7" fill="#c8735d"/><text x="660" y="12" class="s">Every phase is timeout-guarded</text></g><text x="50" y="866" class="s">Agent layer: route and threshold recommendations</text><text x="1350" y="866" text-anchor="end" class="s">Control layer: state transitions, actuation, recovery</text>
</svg>
