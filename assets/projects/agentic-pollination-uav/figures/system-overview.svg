<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d">
<title id="t">Agentic Pollination UAV architecture</title><desc id="d">Hardware feeds perception, bounded mission decisions, and a five-step pollination action sequence.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#214b48"/></marker><style>.h{font:600 15px Arial;letter-spacing:2px;fill:#5e6c68}.n{font:600 18px Arial;fill:#183936}.s{font:14px Arial;fill:#64736f}.b{fill:#faf8f1;stroke:#9baca6;stroke-width:1.5}.g{fill:#dbe8df;stroke:#78938a;stroke-width:1.5}.l{stroke:#214b48;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1400" height="760" fill="#f2f1ea"/><text x="50" y="48" class="h">01 · EMBEDDED HARDWARE</text>
<g class="n" text-anchor="middle"><g transform="translate(50 75)"><rect class="b" width="200" height="78"/><text x="100" y="35">Camera</text><text x="100" y="58" class="s">visual input</text></g><g transform="translate(270 75)"><rect class="b" width="200" height="78"/><text x="100" y="35">Pixhawk</text><text x="100" y="58" class="s">flight control</text></g><g transform="translate(490 75)"><rect class="b" width="200" height="78"/><text x="100" y="35">Raspberry Pi 4</text><text x="100" y="58" class="s">mission compute</text></g><g transform="translate(710 75)"><rect class="b" width="200" height="78"/><text x="100" y="35">Coral TPU</text><text x="100" y="58" class="s">edge inference</text></g><g transform="translate(930 75)"><rect class="b" width="200" height="78"/><text x="100" y="35">Servo motor</text><text x="100" y="58" class="s">pollen actuation</text></g><g transform="translate(1150 75)"><rect class="b" width="200" height="78"/><text x="100" y="35">GPS + compass</text><text x="100" y="58" class="s">position + heading</text></g></g>
<path d="M700 153v55" class="l"/><text x="722" y="188" class="h">SENSOR DATA</text><text x="50" y="235" class="h">02 · PERCEPTION</text>
<rect x="50" y="260" width="630" height="88" class="g"/><text x="82" y="298" class="n">Flower detection</text><text x="82" y="325" class="s">camera frames → targets + confidence</text><rect x="720" y="260" width="630" height="88" class="g"/><text x="752" y="298" class="n">Sensor fusion</text><text x="752" y="325" class="s">position + motion + stability → vehicle state</text>
<path d="M700 348v55" class="l"/><text x="722" y="383" class="h">PROCESSED STATE</text><text x="50" y="430" class="h">03 · BOUNDED DECISION LAYER</text>
<g class="n"><g transform="translate(50 455)"><rect class="b" width="236" height="92"/><text x="20" y="38">Mission manager</text><text x="20" y="65" class="s">13-phase state machine</text></g><g transform="translate(316 455)"><rect class="b" width="236" height="92"/><text x="20" y="38">Agent decisions</text><text x="20" y="65" class="s">bounded recommendations</text></g><g transform="translate(582 455)"><rect class="b" width="236" height="92"/><text x="20" y="38">Mission memory</text><text x="20" y="65" class="s">RAG context + state</text></g><g transform="translate(848 455)"><rect class="b" width="236" height="92"/><text x="20" y="38">Adaptive threshold</text><text x="20" y="65" class="s">contextual UCB1</text></g><g transform="translate(1114 455)"><rect class="b" width="236" height="92"/><text x="20" y="38">Route planner</text><text x="20" y="65" class="s">greedy TSP</text></g></g>
<path d="M700 547v55" class="l"/><text x="722" y="582" class="h">ACTION COMMANDS</text><text x="50" y="630" class="h">04 · POLLINATION SEQUENCE</text>
<path d="M165 685h115m165 0h115m180 0h115m180 0h115" class="l"/><g class="n"><circle cx="80" cy="685" r="8" fill="#d06e57"/><text x="100" y="691">Descend</text><circle cx="340" cy="685" r="8" fill="#d4a84f"/><text x="360" y="691">Hover align</text><circle cx="620" cy="685" r="8" fill="#78938a"/><text x="640" y="691">Servo actuate</text><circle cx="895" cy="685" r="8" fill="#d06e57"/><text x="915" y="691">Pollen release</text><circle cx="1215" cy="685" r="8" fill="#214b48"/><text x="1235" y="691">Ascend</text></g>
</svg>
