<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 840" role="img" aria-labelledby="title description">
<title id="title">Agentic Pollination UAV system architecture</title><desc id="description">Embedded hardware feeds perception and a bounded decision layer, which controls a five-stage pollination sequence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#214b48"/></marker><style>.eyebrow{font:700 14px Arial,sans-serif;letter-spacing:2.2px;fill:#64716e}.title{font:700 19px Arial,sans-serif;fill:#173936}.sub{font:400 13px Arial,sans-serif;fill:#68736f}.card{fill:#faf9f3;stroke:#a6b2ad;stroke-width:1.4}.soft{fill:#dfe9e2;stroke:#82978f;stroke-width:1.4}.accent{fill:#f2e0d7;stroke:#bd806c;stroke-width:1.4}.wire{fill:none;stroke:#214b48;stroke-width:1.8}.flow{fill:none;stroke:#214b48;stroke-width:2;marker-end:url(#arrow)}.tap{fill:#f2f1ea;stroke:#214b48;stroke-width:1.6}.step{font:700 12px Arial,sans-serif;letter-spacing:1.2px;fill:#8a9893}</style></defs>
<rect width="1400" height="840" fill="#f2f1ea"/><text x="50" y="48" class="eyebrow">01 · EMBEDDED HARDWARE</text>
<g text-anchor="middle"><g transform="translate(50 72)"><rect class="card" width="200" height="80"/><text x="100" y="34" class="title">Camera</text><text x="100" y="58" class="sub">visual input</text></g><g transform="translate(270 72)"><rect class="card" width="200" height="80"/><text x="100" y="34" class="title">Pixhawk</text><text x="100" y="58" class="sub">flight control</text></g><g transform="translate(490 72)"><rect class="card" width="200" height="80"/><text x="100" y="34" class="title">Raspberry Pi 4</text><text x="100" y="58" class="sub">mission compute</text></g><g transform="translate(710 72)"><rect class="card" width="200" height="80"/><text x="100" y="34" class="title">Coral TPU</text><text x="100" y="58" class="sub">edge inference</text></g><g transform="translate(930 72)"><rect class="card" width="200" height="80"/><text x="100" y="34" class="title">Servo motor</text><text x="100" y="58" class="sub">pollen actuation</text></g><g transform="translate(1150 72)"><rect class="card" width="200" height="80"/><text x="100" y="34" class="title">GPS + compass</text><text x="100" y="58" class="sub">position + heading</text></g></g>
<path class="wire" d="M150 152v24m220-24v24m220-24v24m220-24v24m220-24v24m220-24v24M150 176h1100"/><circle class="tap" cx="700" cy="176" r="5"/><path class="flow" d="M700 181v42"/><text x="720" y="207" class="eyebrow">SENSOR + CONTROL BUS</text>
<text x="50" y="256" class="eyebrow">02 · PERCEPTION</text><g transform="translate(50 278)"><rect class="soft" width="630" height="92"/><text x="30" y="39" class="title">Flower detection</text><text x="30" y="66" class="sub">camera frames → candidate targets + confidence</text></g><g transform="translate(720 278)"><rect class="soft" width="630" height="92"/><text x="30" y="39" class="title">Sensor fusion</text><text x="30" y="66" class="sub">position + motion + stability → vehicle state</text></g>
<path class="wire" d="M365 370v22m670-22v22M365 392h670"/><circle class="tap" cx="700" cy="392" r="5"/><path class="flow" d="M700 397v41"/><text x="720" y="423" class="eyebrow">PROCESSED STATE</text>
<text x="50" y="472" class="eyebrow">03 · BOUNDED DECISION LAYER</text><g><g transform="translate(50 494)"><rect class="card" width="236" height="96"/><text x="20" y="39" class="title">Mission manager</text><text x="20" y="67" class="sub">13-phase state machine</text></g><g transform="translate(316 494)"><rect class="card" width="236" height="96"/><text x="20" y="39" class="title">Agent decisions</text><text x="20" y="67" class="sub">bounded recommendations</text></g><g transform="translate(582 494)"><rect class="card" width="236" height="96"/><text x="20" y="39" class="title">Mission memory</text><text x="20" y="67" class="sub">RAG context + state</text></g><g transform="translate(848 494)"><rect class="card" width="236" height="96"/><text x="20" y="39" class="title">Adaptive threshold</text><text x="20" y="67" class="sub">contextual UCB1</text></g><g transform="translate(1114 494)"><rect class="card" width="236" height="96"/><text x="20" y="39" class="title">Route planner</text><text x="20" y="67" class="sub">greedy TSP</text></g></g>
<path class="wire" d="M168 590v22m266-22v22m266-22v22m266-22v22m266-22v22M168 612h1064"/><circle class="tap" cx="700" cy="612" r="5"/><path class="flow" d="M700 617v40"/><text x="720" y="643" class="eyebrow">VALIDATED ACTION COMMAND</text>
<text x="50" y="690" class="eyebrow">04 · POLLINATION SEQUENCE</text><g text-anchor="middle"><g transform="translate(50 714)"><rect class="card" width="220" height="78" rx="39"/><circle cx="82" cy="39" r="8" fill="#c8735d"/><text x="126" y="34" class="step">01</text><text x="126" y="57" class="title">Descend</text></g><g transform="translate(320 714)"><rect class="card" width="220" height="78" rx="39"/><circle cx="72" cy="39" r="8" fill="#d5aa50"/><text x="122" y="34" class="step">02</text><text x="122" y="57" class="title">Hover align</text></g><g transform="translate(590 714)"><rect class="card" width="220" height="78" rx="39"/><circle cx="72" cy="39" r="8" fill="#82978f"/><text x="122" y="34" class="step">03</text><text x="122" y="57" class="title">Servo actuate</text></g><g transform="translate(860 714)"><rect class="accent" width="220" height="78" rx="39"/><circle cx="70" cy="39" r="8" fill="#c8735d"/><text x="120" y="34" class="step">04</text><text x="120" y="57" class="title">Pollen release</text></g><g transform="translate(1130 714)"><rect class="card" width="220" height="78" rx="39"/><circle cx="82" cy="39" r="8" fill="#214b48"/><text x="126" y="34" class="step">05</text><text x="126" y="57" class="title">Ascend</text></g></g><path class="flow" d="M270 753h40"/><path class="flow" d="M540 753h40"/><path class="flow" d="M810 753h40"/><path class="flow" d="M1080 753h40"/>
</svg>
