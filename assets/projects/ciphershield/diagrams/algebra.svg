<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
 <title id="title">CipherShield homomorphic addition algebra</title><desc id="desc">Packed demographic vectors are encrypted independently; ciphertext addition produces an encryption of the coordinate-wise sum.</desc>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#283f3b"/></marker><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#243d38" flood-opacity=".12"/></filter></defs>
 <style>text{font-family:'DM Sans',Arial,sans-serif;fill:#203632}.m{font-family:'DM Mono',monospace;letter-spacing:2px}.e{font-size:13px;font-weight:700;fill:#707b78}.h{font-size:34px;font-weight:700;letter-spacing:-1px}.n{font-size:20px;font-weight:700}.c{font-size:14px;fill:#626d6a}.eq{font-family:Georgia,serif;font-size:24px;font-style:italic}.card{stroke:#9da9a5;stroke-width:1.5;transition:filter .22s,stroke .22s}.node:hover .card{filter:url(#s);stroke:#315d54}.wire{fill:none;stroke:#283f3b;stroke-width:2;marker-end:url(#a);stroke-dasharray:8 7;animation:move 10s linear infinite}.slot{fill:#e5e0ed;stroke:#aa9db8}.sum{fill:#dce9e3;stroke:#879e97}.op{font-family:Georgia,serif;font-size:31px;font-weight:700}.pulse{animation:pulse 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes move{to{stroke-dashoffset:-150}}@keyframes pulse{0%,100%{opacity:.55;transform:scale(.75)}50%{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){.wire,.pulse{animation:none}}</style>
 <rect width="1400" height="760" fill="#f5f3ec"/><text class="m e" x="70" y="58">CIPHERSHIELD · PACKED AGGREGATION</text><text class="h" x="70" y="105">Linearity moves the computation into ciphertext space</text><text class="c" x="70" y="136">BFV-RNS preserves exact modular addition across SIMD-packed integer slots.</text>
 <g class="node"><rect class="card" x="70" y="200" width="360" height="150" rx="5" fill="#fbfaf6"/><text class="m e" x="94" y="230">RECORD i</text><text class="eq" x="94" y="272">mᵢ = [xᵢ₁, xᵢ₂, …, xᵢₛ]</text><g transform="translate(94 294)"><rect class="slot" width="54" height="30"/><rect class="slot" x="60" width="54" height="30"/><rect class="slot" x="120" width="54" height="30"/><rect class="slot" x="180" width="54" height="30"/><rect class="slot" x="240" width="54" height="30"/></g></g>
 <g class="node"><rect class="card" x="70" y="405" width="360" height="150" rx="5" fill="#fbfaf6"/><text class="m e" x="94" y="435">RECORD j</text><text class="eq" x="94" y="477">mⱼ = [xⱼ₁, xⱼ₂, …, xⱼₛ]</text><g transform="translate(94 499)"><rect class="slot" width="54" height="30"/><rect class="slot" x="60" width="54" height="30"/><rect class="slot" x="120" width="54" height="30"/><rect class="slot" x="180" width="54" height="30"/><rect class="slot" x="240" width="54" height="30"/></g></g>
 <path class="wire" d="M430 275h118v95h80"/><path class="wire" d="M430 480h118v-95h80"/><circle cx="548" cy="377" r="7" fill="#bd6c58" class="pulse"/>
 <g class="node"><rect class="card" x="628" y="292" width="278" height="176" rx="5" fill="#e7e1ed"/><text class="m e" x="652" y="322">HOMOMORPHIC FOLD</text><text class="op" x="652" y="372">CΣ = cᵢ ⊕ cⱼ</text><text class="eq" x="652" y="416">= Encₚₖ(mᵢ + mⱼ)</text><text class="c" x="652" y="445">implemented with EvalAdd</text></g>
 <path class="wire" d="M906 380h100"/>
 <g class="node"><rect class="card" x="1006" y="260" width="324" height="240" rx="5" fill="#dfeae5"/><text class="m e" x="1030" y="290">JOINT RELEASE</text><text class="eq" x="1030" y="340">DecFuse(CΣ)</text><text class="op" x="1030" y="390">[Σx₁, Σx₂, …, Σxₛ]</text><g transform="translate(1030 425)"><rect class="sum" width="50" height="34"/><rect class="sum" x="57" width="50" height="34"/><rect class="sum" x="114" width="50" height="34"/><rect class="sum" x="171" width="50" height="34"/><rect class="sum" x="228" width="50" height="34"/></g><text class="c" x="1030" y="483">aggregate slots—not source records</text></g>
 <rect x="70" y="625" width="1260" height="72" rx="4" fill="#eee4c5"/><text class="m e" x="96" y="654">ARITHMETIC DOMAIN</text><text class="n" x="96" y="681">ℤ₆₅₅₃₇ · multiplicative depth 2 · 16 configured packed slots · exact modular sums</text>
</svg>
