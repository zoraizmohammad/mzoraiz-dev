<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Split-key ciphertext and partial-decryption choreography</title>
  <desc id="desc">Two parties derive a joint public key, exchange only ciphertexts, and contribute separate partial decryptions to reveal an aggregate.</desc>
  <defs>
    <radialGradient id="field">
      <stop offset="0" stop-color="#9ccbc1" stop-opacity=".42"/>
      <stop offset="1" stop-color="#263f3a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#d9a07f"/>
    </marker>
  </defs>
  <style>text{font-family:'DM Mono',monospace;fill:#dfe8e5}.eyebrow{font-size:13px;letter-spacing:2.5px}.headline{font-family:'DM Sans',sans-serif;font-size:29px;font-weight:700}.node-title{font-family:'DM Sans',sans-serif;font-size:17px;font-weight:700}.small{font-size:11px;letter-spacing:1px}.formula{font-size:16px}.orbit{fill:none;stroke:#718782;stroke-width:1.3;stroke-dasharray:5 10}.packet{fill:#e7e1ef;stroke:#b29fbd;stroke-width:1.5}.share{fill:#c97761}.trace,.exchange{fill:none;stroke:#d9a07f;stroke-width:2;stroke-dasharray:7 8;animation:dash 9s linear infinite}.exchange{marker-end:url(#arrow);animation-duration:7s}.spin{transform-origin:790px 330px;animation:spin 18s linear infinite}.counter{transform-origin:790px 330px;animation:spin 13s linear infinite reverse}.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 3s ease-in-out infinite}.party{fill:#20312e;stroke:#768b86;stroke-width:1.4}.divider{stroke:#405652}.key{fill:#f1e7c9}.keyline{stroke:#d9a07f;stroke-width:2;fill:none;marker-end:url(#arrow)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes dash{to{stroke-dashoffset:-130}}@keyframes breathe{0%,100%{transform:scale(.93);opacity:.8}50%{transform:scale(1.05);opacity:1}}@media(prefers-reduced-motion:reduce){.spin,.counter,.trace,.exchange,.breathe{animation:none}}</style>
  <rect width="1200" height="640" fill="#172623"/>
  <text class="eyebrow" x="52" y="53">SPLIT-KEY COMPUTATION FIELD</text>
  <text class="headline" x="52" y="92">Ciphertexts move.</text>
  <text class="headline" x="52" y="126">Secret shares do not.</text>
  <g>
    <rect class="party" x="52" y="183" width="260" height="126" rx="3"/>
    <text class="small" x="75" y="211">PARTY A &#xB7; DATA HOLDER</text>
    <text class="node-title" x="75" y="244">Secret share sk&#x2081;</text>
    <text class="small" x="75" y="275">publishes pk&#x2081; &#xB7; retains sk&#x2081;</text>
    <rect class="party" x="52" y="348" width="260" height="126" rx="3"/>
    <text class="small" x="75" y="376">PARTY B &#xB7; DATA HOLDER</text>
    <text class="node-title" x="75" y="409">Secret share sk&#x2082;</text>
    <text class="small" x="75" y="440">publishes pk&#x2082; &#xB7; retains sk&#x2082;</text>
    <path class="exchange" d="M312 224C385 224 397 272 454 287"/>
    <text class="small" x="331" y="214">PUBLIC-KEY SHARE</text>
    <path class="exchange" d="M312 412C385 412 397 365 454 350"/>
    <text class="small" x="331" y="435">PUBLIC-KEY SHARE</text>
    <path class="divider" d="M52 509h350"/>
    <text class="small" x="52" y="539">JOINT KEY</text>
    <text class="formula" x="52" y="567">pk = Combine(pk&#x2081;, pk&#x2082;)</text>
    <text class="small" x="52" y="598">NO COMPLETE SECRET KEY IS FORMED</text>
  </g>
  <g>
    <circle cx="790" cy="330" r="280" fill="url(#field)"/>
    <circle class="orbit" cx="790" cy="330" r="218"/>
    <circle class="orbit" cx="790" cy="330" r="164"/>
    <circle class="orbit" cx="790" cy="330" r="112"/>
    <g class="spin">
      <rect class="packet" x="768" y="90" width="44" height="44" rx="7" transform="rotate(45 790 112)"/>
      <rect class="packet" x="768" y="526" width="44" height="44" rx="7" transform="rotate(45 790 548)"/>
      <rect class="packet" x="550" y="308" width="44" height="44" rx="7" transform="rotate(45 572 330)"/>
      <rect class="packet" x="986" y="308" width="44" height="44" rx="7" transform="rotate(45 1008 330)"/>
    </g>
    <g class="counter">
      <circle class="share" cx="790" cy="166" r="12"/>
      <circle class="share" cx="790" cy="494" r="12"/>
      <circle class="share" cx="626" cy="330" r="12"/>
      <circle class="share" cx="954" cy="330" r="12"/>
    </g>
    <path class="trace" d="M790 112C950 112 1008 195 1008 330S950 548 790 548 572 465 572 330 630 112 790 112Z"/>
    <g class="breathe">
      <circle cx="790" cy="330" r="78" fill="#253d38" stroke="#9ccbc1" stroke-width="2"/>
      <circle class="key" cx="790" cy="382" r="13" filter="url(#glow)"/>
    </g>
    <text class="small" x="730" y="287">HOMOMORPHIC SUM</text>
    <text class="formula" x="711" y="323">c&#x3A3; = &#x3A3; Enc&#x209A;&#x2096;(m&#x1D62;)</text>
    <text class="formula" x="737" y="352">m&#x3A3; = d&#x2081; &#x2295; d&#x2082;</text>
    <path class="keyline" d="M592 493C630 477 666 450 699 414"/>
    <text class="small" x="504" y="514">PARTIAL d&#x2081;</text>
    <path class="keyline" d="M988 493C950 477 914 450 881 414"/>
    <text class="small" x="951" y="514">PARTIAL d&#x2082;</text>
    <text class="small" x="676" y="601">ONE AUTHORIZED AGGREGATE RELEASE</text>
  </g>
</svg>
