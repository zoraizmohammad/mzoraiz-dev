<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
 <title id="title">CipherShield split-key aggregation protocol</title><desc id="desc">Sensitive vectors are packed and encrypted under a joint public key, homomorphically summed, and revealed only after two partial decryptions are fused.</desc>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#283f3b"/></marker><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#253d39" flood-opacity=".13"/></filter></defs>
 <style>text{font-family:'DM Sans',Arial,sans-serif;fill:#203632}.m{font-family:'DM Mono',monospace;letter-spacing:2px}.e{font-size:13px;font-weight:700;fill:#707b78}.h{font-size:34px;font-weight:700;letter-spacing:-1px}.n{font-size:21px;font-weight:700}.c{font-size:14px;fill:#626d6a}.b{stroke:#9da9a5;stroke-width:1.5;transition:filter .22s,stroke .22s}.node:hover .b{filter:url(#s);stroke:#315d54}.node:hover .n{fill:#9b604f}.line{fill:none;stroke:#283f3b;stroke-width:2;marker-end:url(#a)}.motion{stroke-dasharray:8 7;animation:move 11s linear infinite}.guard{fill:#eee4c5;stroke:#b59b55;stroke-width:1.5}.pulse{fill:#bd6c58;animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes move{to{stroke-dashoffset:-150}}@keyframes pulse{0%,100%{opacity:.5;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){.motion,.pulse{animation:none}}</style>
 <rect width="1400" height="820" fill="#f5f3ec"/><text class="m e" x="70" y="58">CIPHERSHIELD · COMPUTATION PATH</text><text class="h" x="70" y="105">Aggregate first. Decrypt together.</text><text class="c" x="70" y="136">The aggregation service evaluates addition over ciphertexts and never receives either complete secret key.</text>
 <path class="line motion" d="M260 306H405"/><path class="line motion" d="M665 306H810"/><path class="line motion" d="M1070 306h120v118"/><path class="line motion" d="M1000 516v76h-238"/>
 <g class="node"><rect class="b" x="70" y="226" width="190" height="160" rx="5" fill="#fbfaf6"/><text class="m e" x="94" y="256">01 · SOURCE</text><text class="n" x="94" y="298">Record vector</text><text class="c" x="94" y="329">mᵢ ∈ ℤₚˢ</text><text class="c" x="94" y="354">s ≤ 16 packed slots</text></g>
 <g class="node"><rect class="b" x="405" y="226" width="260" height="160" rx="5" fill="#e6e0ed"/><text class="m e" x="429" y="256">02 · CLIENT</text><text class="n" x="429" y="298">BFV-RNS encrypt</text><text class="c" x="429" y="329">cᵢ = Encₚₖⱼ(mᵢ)</text><text class="c" x="429" y="354">plaintext modulus 65,537</text></g>
 <g class="node"><rect class="b" x="810" y="226" width="260" height="160" rx="5" fill="#dfeae5"/><text class="m e" x="834" y="256">03 · FHE SERVER</text><text class="n" x="834" y="298">Ciphertext fold</text><text class="c" x="834" y="329">CΣ = Σᵢ cᵢ via EvalAdd</text><text class="c" x="834" y="354">no plaintext inspection</text></g>
 <g><rect class="guard" x="1190" y="226" width="150" height="290" rx="5"/><text class="m e" x="1214" y="256">CHAIN</text><text class="n" x="1214" y="298">Cohort</text><text class="n" x="1214" y="324">guard</text><text class="c" x="1214" y="365">n ≥ 10</text><text class="c" x="1214" y="395">request</text><text class="c" x="1214" y="416">validation</text><text class="c" x="1214" y="446">event trail</text><circle class="pulse" cx="1265" cy="482" r="7"/></g>
 <text class="m e" x="70" y="490">TWO-PARTY RELEASE</text>
 <g class="node"><rect class="b" x="70" y="516" width="300" height="150" rx="5" fill="#fbfaf6"/><text class="m e" x="94" y="546">AUTHORITY SHARE</text><text class="n" x="94" y="589">d₁ ← PartialLead(CΣ)</text><text class="c" x="94" y="624">insufficient alone</text></g>
 <g class="node"><rect class="b" x="440" y="516" width="300" height="150" rx="5" fill="#fbfaf6"/><text class="m e" x="464" y="546">COMPANY SHARE</text><text class="n" x="464" y="589">d₂ ← PartialMain(CΣ)</text><text class="c" x="464" y="624">insufficient alone</text></g>
 <path class="line motion" d="M370 591h55"/><path class="line motion" d="M740 591h55"/>
 <g class="node"><rect class="b" x="795" y="516" width="275" height="150" rx="5" fill="#e2ebe7"/><text class="m e" x="819" y="546">FUSION</text><text class="n" x="819" y="589">DecFuse(d₁,d₂)</text><text class="c" x="819" y="624">reveals only Σᵢmᵢ</text></g>
 <rect x="70" y="718" width="1270" height="52" rx="4" fill="#ece8df"/><text class="m e" x="94" y="749">TRUST BOUNDARY</text><text class="c" x="285" y="749">Confidentiality depends on non-collusion, parameter correctness, endpoint security, and controlled result release.</text>
</svg>
