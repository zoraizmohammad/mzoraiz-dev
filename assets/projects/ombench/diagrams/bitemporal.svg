<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Bitemporal state reconstruction</title><desc id="desc">Events are filtered by valid and ingestion time before a deterministic fold reconstructs the state visible on May 14.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#294843"/></marker><filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#213b37" flood-opacity=".12"/></filter></defs>
  <style>text{font-family:'DM Sans',Arial,sans-serif;fill:#203834}.mono{font-family:'DM Mono',monospace;letter-spacing:1.7px}.eyebrow{font-size:13px;font-weight:700;fill:#6b7774}.heading{font-size:32px;font-weight:700;letter-spacing:-1px}.copy{font-size:14px;fill:#64706d}.label{font-size:12px;font-weight:700;fill:#78837f}.event-title{font-size:18px;font-weight:700}.event-copy{font-size:13px;fill:#64706d}.card{stroke:#9eaaa6;stroke-width:1.5;transition:filter .22s ease,stroke .22s ease}.event:hover .card{filter:url(#lift);stroke:#294843}.axis{stroke:#72817d;stroke-width:1.5}.guide{stroke:#b8c1bd;stroke-width:1;stroke-dasharray:5 6}.window{fill:#dfeae5;opacity:.68}.cut{stroke:#b5624d;stroke-width:2;stroke-dasharray:7 7}.route{fill:none;stroke:#294843;stroke-width:2;marker-end:url(#arrow);stroke-dasharray:8 7;animation:travel 10s linear infinite}.included{fill:#47766b}.excluded{fill:#c8765d}.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes travel{to{stroke-dashoffset:-150}}@keyframes pulse{0%,100%{opacity:.55;transform:scale(.75)}50%{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){.route,.pulse{animation:none}}</style>
  <rect width="1200" height="720" fill="#f5f3ec"/><text class="mono eyebrow" x="64" y="54">OMBENCH · BITEMPORAL REPLAY</text><text class="heading" x="64" y="96">Reconstruct only what was knowable</text><text class="copy" x="64" y="124">A fair backtest requires an event to satisfy both historical coordinates.</text>
  <text class="mono label" x="64" y="180">VALID TIME T →</text><line class="axis" x1="188" y1="176" x2="1128" y2="176" marker-end="url(#arrow)"/><rect class="window" x="188" y="198" width="535" height="274" rx="6"/><line class="cut" x1="723" y1="160" x2="723" y2="488"/><text class="mono label" x="675" y="510">T = MAY 14</text><line class="guide" x1="188" y1="246" x2="1128" y2="246"/><line class="guide" x1="188" y1="348" x2="1128" y2="348"/><line class="guide" x1="188" y1="450" x2="1128" y2="450"/>
  <text class="mono label" x="64" y="225">INGESTION</text><text class="mono label" x="64" y="244">TIME τ ↓</text><line class="axis" x1="164" y1="198" x2="164" y2="472" marker-end="url(#arrow)"/><line class="cut" x1="148" y1="398" x2="1144" y2="398"/><text class="mono label" x="64" y="393">τ = MAY 14</text>
  <g class="event"><rect class="card" x="228" y="214" width="274" height="70" rx="5" fill="#fbfaf6"/><circle class="included pulse" cx="250" cy="236" r="6"/><text class="event-title" x="270" y="241">e₁ · initial schedule</text><text class="event-copy" x="250" y="265">valid May 1 · ingested May 1 · 09:00</text></g>
  <g class="event"><rect class="card" x="380" y="414" width="290" height="70" rx="5" fill="#eaded9"/><circle class="excluded" cx="402" cy="436" r="6"/><text class="event-title" x="422" y="441">e₂ · late backfill</text><text class="event-copy" x="402" y="465">valid May 1 · ingested May 19</text></g>
  <g class="event"><rect class="card" x="810" y="298" width="290" height="70" rx="5" fill="#eaded9"/><circle class="excluded" cx="832" cy="320" r="6"/><text class="event-title" x="852" y="325">e₃ · reschedule</text><text class="event-copy" x="832" y="349">valid May 20 · ingested May 20</text></g>
  <path class="route" d="M365 284v76h408v164"/>
  <text class="mono label" x="64" y="566">SELECTION CONTRACT</text><rect x="64" y="588" width="630" height="82" rx="5" fill="#fbfaf6" stroke="#9eaaa6" stroke-width="1.5"/><text class="event-title" x="92" y="620">valid_at(e) ≤ T  ∧  ingested_at(e) ≤ τ</text><text class="event-copy" x="92" y="647">e₁ passes both cuts; e₂ and e₃ are excluded before the fold.</text>
  <rect x="738" y="524" width="398" height="146" rx="5" fill="#e4ece8" stroke="#7f9690" stroke-width="1.5"/><text class="mono label" x="766" y="554">DETERMINISTIC FOLD</text><text class="event-title" x="766" y="592">S(May 14, May 14)</text><text class="heading" x="766" y="636">start = 09:00</text><text class="event-copy" x="766" y="658">No late-backfill or future-state leakage.</text>
</svg>
