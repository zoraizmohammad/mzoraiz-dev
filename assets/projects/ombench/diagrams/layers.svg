<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Ombench package dependency layers</title><desc id="desc">Five tiers flow from interfaces through orchestration, domain services, shared substrates, and storage.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#294843"/></marker><filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#213b37" flood-opacity=".12"/></filter></defs>
  <style>text{font-family:'DM Sans',Arial,sans-serif;fill:#203834}.mono{font-family:'DM Mono',monospace;letter-spacing:2px}.eyebrow{font-size:13px;font-weight:700;fill:#6b7774}.heading{font-size:32px;font-weight:700;letter-spacing:-1px}.tier{font-size:12px;font-weight:700;fill:#74807d}.name{font-size:21px;font-weight:700}.detail{font-size:13px;fill:#65706d}.box{stroke:#9eaaa6;stroke-width:1.5;transition:filter .24s ease,stroke .24s ease}.node:hover .box{filter:url(#lift);stroke:#294843}.node:hover .name{fill:#b5624d}.flow{fill:none;stroke:#294843;stroke-width:1.7;marker-end:url(#arrow);stroke-dasharray:7 7;animation:dash 12s linear infinite}.spine{fill:none;stroke:#294843;stroke-width:1.5}.dot{fill:#f6f4ed;stroke:#294843;stroke-width:2}.pulse{fill:#c8765d;animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes dash{to{stroke-dashoffset:-140}}@keyframes pulse{0%,100%{opacity:.55;transform:scale(.72)}50%{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style>
  <rect width="1200" height="760" fill="#f5f3ec"/><text class="mono eyebrow" x="64" y="58">OMBENCH · PACKAGE ARCHITECTURE</text><text class="heading" x="64" y="102">Dependencies point strictly downward</text><text class="detail" x="64" y="130">Interfaces remain thin; each tier imports only the stable contracts beneath it.</text>
  <path class="flow" d="M600 214V252"/><path class="flow" d="M600 354V392"/><path class="flow" d="M600 494V532"/><path class="flow" d="M600 634V672"/>
  <circle class="pulse" cx="600" cy="233" r="5"/><circle class="pulse" cx="600" cy="373" r="5" style="animation-delay:.5s"/><circle class="pulse" cx="600" cy="513" r="5" style="animation-delay:1s"/><circle class="pulse" cx="600" cy="653" r="5" style="animation-delay:1.5s"/>
  <text class="mono tier" x="64" y="183">01 · INTERFACES</text><g class="node"><rect class="box" x="250" y="164" width="700" height="50" rx="4" fill="#fbfaf6"/><text class="name" x="278" y="194">CLI + applications</text><text class="detail" x="474" y="194">trace · sync · snapshot · memory · evaluate · visualize</text></g>
  <text class="mono tier" x="64" y="279">02 · ORCHESTRATION</text><g class="node"><rect class="box" x="64" y="292" width="514" height="62" rx="4" fill="#e4ece8"/><text class="name" x="88" y="319">Evaluation</text><text class="detail" x="88" y="340">tasks · rubrics · judges · runner · statistics · reports</text></g><g class="node"><rect class="box" x="622" y="292" width="514" height="62" rx="4" fill="#e8e5ee"/><text class="name" x="646" y="319">Replay</text><text class="detail" x="646" y="340">sandbox · validators · fault injection · deterministic clocks</text></g><path class="spine" d="M321 354v19h558v-19"/><circle class="dot" cx="600" cy="373" r="5"/>
  <text class="mono tier" x="64" y="419">03 · DOMAIN SERVICES</text><g class="node"><rect class="box" x="64" y="432" width="330" height="62" rx="4" fill="#fbfaf6"/><text class="name" x="88" y="459">Integrations</text><text class="detail" x="88" y="480">Slack · Calendar · Docs · Gmail</text></g><g class="node"><rect class="box" x="435" y="432" width="330" height="62" rx="4" fill="#efe5c9"/><text class="name" x="459" y="459">Memory</text><text class="detail" x="459" y="480">compile · retrieve · score · resolve</text></g><g class="node"><rect class="box" x="806" y="432" width="330" height="62" rx="4" fill="#fbfaf6"/><text class="name" x="830" y="459">Model adapters</text><text class="detail" x="830" y="480">stub · Anthropic client · agent</text></g><path class="spine" d="M229 494v19h742v-19"/><circle class="dot" cx="600" cy="513" r="5"/>
  <text class="mono tier" x="64" y="559">04 · SHARED SUBSTRATES</text><g class="node"><rect class="box" x="64" y="572" width="330" height="62" rx="4" fill="#e4ece8"/><text class="name" x="88" y="599">Events</text><text class="detail" x="88" y="620">schema · algebra · store · queries</text></g><g class="node"><rect class="box" x="435" y="572" width="330" height="62" rx="4" fill="#e4ece8"/><text class="name" x="459" y="599">Snapshots</text><text class="detail" x="459" y="620">materialize · manifest · diff</text></g><g class="node"><rect class="box" x="806" y="572" width="330" height="62" rx="4" fill="#e4ece8"/><text class="name" x="830" y="599">Traces</text><text class="detail" x="830" y="620">ingest · redact · convert · OTel</text></g><path class="spine" d="M229 634v19h742v-19"/><circle class="dot" cx="600" cy="653" r="5"/>
  <text class="mono tier" x="64" y="699">05 · PERSISTENCE</text><g class="node"><rect class="box" x="250" y="672" width="700" height="54" rx="4" fill="#e9ddd8"/><text class="name" x="278" y="705">Storage backends</text><text class="detail" x="494" y="705">SQLite · PostgreSQL · content-addressed blob store</text></g>
</svg>
