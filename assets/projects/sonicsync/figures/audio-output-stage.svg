<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">SonicSync audio output stage</title><desc id="desc">An Arduino Nano generates a programmable waveform that travels over a tether to a twelve volt amplifier and a wrist-mounted underwater speaker.</desc>
  <defs><style>.bg{fill:#f7f6f1}.box{fill:#fff;stroke:#79908b;stroke-width:2.5}.active{fill:#e1ebe7;stroke:#31534d;stroke-width:2.5}.accent{fill:#f1e4c4;stroke:#b58a35;stroke-width:2.5}.wire{fill:none;stroke:#31534d;stroke-width:4}.dash{fill:none;stroke:#78908b;stroke-width:3;stroke-dasharray:10 10}.label{font:600 25px 'DM Sans',Arial,sans-serif;fill:#213934}.small{font:17px 'DM Mono',monospace;fill:#66736f}.pin{font:600 18px 'DM Mono',monospace;fill:#31534d}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#31534d"/></marker></defs>
  <rect class="bg" width="1200" height="700"/><text class="small" x="55" y="58">SONICSYNC · ACOUSTIC PATH</text><text class="label" x="55" y="98">Programmable tone delivery from surface to diver</text>
  <rect class="active" x="65" y="210" width="235" height="220" rx="8"/><text class="small" x="100" y="250">SURFACE BUOY</text><text class="label" x="100" y="292">Arduino Nano</text><text class="small" x="100" y="330">tone(f, duration)</text><path class="wire" d="M115 370q18-40 36 0t36 0t36 0t36 0"/>
  <path class="wire" d="M300 320H410" marker-end="url(#arrow)"/><rect class="box" x="430" y="235" width="215" height="170" rx="8"/><text class="small" x="465" y="274">TETHER</text><text class="label" x="465" y="316">TRS cable</text><text class="small" x="465" y="350">signal + ground</text>
  <path class="wire" d="M645 320H755" marker-end="url(#arrow)"/><rect class="accent" x="775" y="205" width="225" height="230" rx="8"/><text class="small" x="812" y="247">DRIVER</text><text class="label" x="812" y="290">Audio amplifier</text><text class="small" x="812" y="329">12 V supply</text><text class="pin" x="812" y="377">L+ / L−</text>
  <path class="wire" d="M1000 320H1080" marker-end="url(#arrow)"/><path class="active" d="M1088 275h35v90h-35l-42 42V233z"/><path class="dash" d="M1108 210q70 110 0 220M1128 180q105 140 0 280"/><text class="small" x="1008" y="515">WRIST-MOUNTED</text><text class="label" x="1008" y="552">speaker</text>
  <path class="dash" d="M182 430V570H887V435"/><text class="small" x="394" y="604">shared ground reference · sealed connectors · replaceable tether</text>
</svg>
