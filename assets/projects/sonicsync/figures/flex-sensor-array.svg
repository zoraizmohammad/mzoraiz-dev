<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Five-channel flex sensor acquisition circuit</title><desc id="desc">Five flex sensor voltage dividers pass through adjustable operational amplifier stages into Arduino Nano analog inputs A1 through A5.</desc>
  <defs><style>.bg{fill:#f7f6f1}.box{fill:#fff;stroke:#79908b;stroke-width:2}.chip{fill:#e1ebe7;stroke:#31534d;stroke-width:2.5}.wire{fill:none;stroke:#31534d;stroke-width:3}.bus{fill:none;stroke:#be8269;stroke-width:3}.label{font:600 23px 'DM Sans',Arial,sans-serif;fill:#213934}.small{font:16px 'DM Mono',monospace;fill:#66736f}.pin{font:600 17px 'DM Mono',monospace;fill:#31534d}.node{fill:#31534d}.accent{fill:#f1e4c4;stroke:#b58a35;stroke-width:2}</style></defs>
  <rect class="bg" width="1200" height="700"/><text class="small" x="54" y="55">SONICSYNC · PROTOTYPE 01</text><text class="label" x="54" y="92">Five-channel flex-sensor acquisition</text>
  <path class="bus" d="M85 145V602M110 145V602"/><text class="small" x="68" y="635">5V</text><text class="small" x="103" y="635">GND</text>
  <rect class="chip" x="930" y="138" width="205" height="475" rx="8"/><text class="label" x="965" y="180">Arduino Nano</text><text class="small" x="965" y="207">ATmega328P · ADC</text>
  <g>
    <rect class="box" x="165" y="135" width="180" height="70" rx="4"/><text class="label" x="195" y="166">Flex sensor 1</text><text class="small" x="195" y="190">variable resistance</text><path class="wire" d="M110 170H165M345 170H405"/><circle class="node" cx="405" cy="170" r="6"/><rect class="accent" x="405" y="145" width="120" height="50" rx="4"/><text class="pin" x="428" y="176">4.7 kΩ</text><path class="wire" d="M525 170H590L630 140V200Z M630 170H930"/><text class="small" x="596" y="126">buffer</text><text class="pin" x="950" y="248">A1</text>
    <rect class="box" x="165" y="225" width="180" height="70" rx="4"/><text class="label" x="195" y="256">Flex sensor 2</text><text class="small" x="195" y="280">variable resistance</text><path class="wire" d="M110 260H165M345 260H405"/><circle class="node" cx="405" cy="260" r="6"/><rect class="accent" x="405" y="235" width="120" height="50" rx="4"/><text class="pin" x="428" y="266">4.7 kΩ</text><path class="wire" d="M525 260H590L630 230V290Z M630 260H930"/><text class="pin" x="950" y="338">A2</text>
    <rect class="box" x="165" y="315" width="180" height="70" rx="4"/><text class="label" x="195" y="346">Flex sensor 3</text><text class="small" x="195" y="370">variable resistance</text><path class="wire" d="M110 350H165M345 350H405"/><circle class="node" cx="405" cy="350" r="6"/><rect class="accent" x="405" y="325" width="120" height="50" rx="4"/><text class="pin" x="428" y="356">4.7 kΩ</text><path class="wire" d="M525 350H590L630 320V380Z M630 350H930"/><text class="pin" x="950" y="428">A3</text>
    <rect class="box" x="165" y="405" width="180" height="70" rx="4"/><text class="label" x="195" y="436">Flex sensor 4</text><text class="small" x="195" y="460">variable resistance</text><path class="wire" d="M110 440H165M345 440H405"/><circle class="node" cx="405" cy="440" r="6"/><rect class="accent" x="405" y="415" width="120" height="50" rx="4"/><text class="pin" x="428" y="446">4.7 kΩ</text><path class="wire" d="M525 440H590L630 410V470Z M630 440H930"/><text class="pin" x="950" y="518">A4</text>
    <rect class="box" x="165" y="495" width="180" height="70" rx="4"/><text class="label" x="195" y="526">Flex sensor 5</text><text class="small" x="195" y="550">variable resistance</text><path class="wire" d="M110 530H165M345 530H405"/><circle class="node" cx="405" cy="530" r="6"/><rect class="accent" x="405" y="505" width="120" height="50" rx="4"/><text class="pin" x="428" y="536">4.7 kΩ</text><path class="wire" d="M525 530H590L630 500V560Z M630 530H930"/><text class="pin" x="950" y="608">A5</text>
  </g><path class="wire" d="M930 238H900V170M930 328H880V260M930 418H860V350M930 508H840V440M930 598H820V530"/>
