<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Five-channel flex sensor acquisition circuit</title><desc id="desc">Five evenly spaced flex-sensor channels pass through adjustable conditioning and unity-gain buffers into Arduino Nano analog inputs A1 through A5.</desc>
  <defs><style>.bg{fill:#f7f6f1}.sensor{fill:#fff;stroke:#82948f;stroke-width:2}.chip{fill:#e1ebe7;stroke:#31534d;stroke-width:2.5}.trim{fill:#f1e4c4;stroke:#b58a35;stroke-width:2}.wire{fill:none;stroke:#31534d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.bus{fill:none;stroke:#be8269;stroke-width:3}.label{font:600 22px Arial,sans-serif;fill:#213934}.small{font:15px monospace;fill:#66736f}.pin{font:600 16px monospace;fill:#31534d}.column{font:600 12px monospace;letter-spacing:1.4px;fill:#77837f}.node{fill:#31534d}</style></defs>
  <rect class="bg" width="1200" height="700"/><text class="small" x="52" y="52">SONICSYNC · PROTOTYPE 01</text><text class="label" x="52" y="88">Five-channel flex-sensor acquisition</text>
  <text class="column" x="166" y="135">FLEX ARRAY</text><text class="column" x="405" y="135">CALIBRATION</text><text class="column" x="570" y="135">UNITY-GAIN BUFFER</text><text class="column" x="955" y="135">10-BIT ADC</text>
  <path class="bus" d="M72 175V580M105 175V580"/><text class="small" x="58" y="616">5 V</text><text class="small" x="92" y="616">GND</text>
  <rect class="chip" x="920" y="150" width="220" height="445" rx="9"/><text class="label" x="955" y="178">Arduino Nano</text><text class="small" x="955" y="201">ATmega328P</text>
  <g>
    <path class="wire" d="M105 220H155M365 220H405M530 220H570L615 190V250Z M615 220H920"/><rect class="sensor" x="155" y="188" width="210" height="64" rx="5"/><text class="label" x="177" y="217">Flex sensor 1</text><text class="small" x="177" y="240">variable resistance</text><circle class="node" cx="405" cy="220" r="5"/><rect class="trim" x="405" y="195" width="125" height="50" rx="5"/><text class="pin" x="432" y="226">4.7 kΩ</text><circle class="node" cx="920" cy="220" r="5"/><text class="pin" x="950" y="226">A1</text>
    <path class="wire" d="M105 300H155M365 300H405M530 300H570L615 270V330Z M615 300H920"/><rect class="sensor" x="155" y="268" width="210" height="64" rx="5"/><text class="label" x="177" y="297">Flex sensor 2</text><text class="small" x="177" y="320">variable resistance</text><circle class="node" cx="405" cy="300" r="5"/><rect class="trim" x="405" y="275" width="125" height="50" rx="5"/><text class="pin" x="432" y="306">4.7 kΩ</text><circle class="node" cx="920" cy="300" r="5"/><text class="pin" x="950" y="306">A2</text>
    <path class="wire" d="M105 380H155M365 380H405M530 380H570L615 350V410Z M615 380H920"/><rect class="sensor" x="155" y="348" width="210" height="64" rx="5"/><text class="label" x="177" y="377">Flex sensor 3</text><text class="small" x="177" y="400">variable resistance</text><circle class="node" cx="405" cy="380" r="5"/><rect class="trim" x="405" y="355" width="125" height="50" rx="5"/><text class="pin" x="432" y="386">4.7 kΩ</text><circle class="node" cx="920" cy="380" r="5"/><text class="pin" x="950" y="386">A3</text>
    <path class="wire" d="M105 460H155M365 460H405M530 460H570L615 430V490Z M615 460H920"/><rect class="sensor" x="155" y="428" width="210" height="64" rx="5"/><text class="label" x="177" y="457">Flex sensor 4</text><text class="small" x="177" y="480">variable resistance</text><circle class="node" cx="405" cy="460" r="5"/><rect class="trim" x="405" y="435" width="125" height="50" rx="5"/><text class="pin" x="432" y="466">4.7 kΩ</text><circle class="node" cx="920" cy="460" r="5"/><text class="pin" x="950" y="466">A4</text>
    <path class="wire" d="M105 540H155M365 540H405M530 540H570L615 510V570Z M615 540H920"/><rect class="sensor" x="155" y="508" width="210" height="64" rx="5"/><text class="label" x="177" y="537">Flex sensor 5</text><text class="small" x="177" y="560">variable resistance</text><circle class="node" cx="405" cy="540" r="5"/><rect class="trim" x="405" y="515" width="125" height="50" rx="5"/><text class="pin" x="432" y="546">4.7 kΩ</text><circle class="node" cx="920" cy="540" r="5"/><text class="pin" x="950" y="546">A5</text>
  </g>
  <rect x="155" y="625" width="985" height="42" rx="5" fill="#fff" stroke="#cbd3d0"/><text class="small" x="180" y="652">Five isolated analog channels · common supply reference · independent threshold calibration</text>
</svg>
