<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Two force-sensitive resistor input circuit</title><desc id="desc">Two independent force-sensitive resistor voltage dividers connect to Arduino Nano inputs A0 and A1.</desc>
  <defs><style>.bg{fill:#f7f6f1}.chip{fill:#e1ebe7;stroke:#31534d;stroke-width:2.5}.sensor{fill:#fff;stroke:#79908b;stroke-width:2}.resistor{fill:#f1e4c4;stroke:#b58a35;stroke-width:2}.wire{fill:none;stroke:#31534d;stroke-width:4}.power{fill:none;stroke:#be8269;stroke-width:4}.label{font:600 25px Arial,sans-serif;fill:#213934}.small{font:17px monospace;fill:#66736f}.pin{font:600 18px monospace;fill:#31534d}.node{fill:#31534d}</style></defs>
  <rect class="bg" width="1200" height="700"/><text class="small" x="55" y="58">SONICSYNC · PROTOTYPE 02</text><text class="label" x="55" y="98">Two-sensor embodied response interface</text>
  <rect class="chip" x="65" y="185" width="260" height="350" rx="8"/><text class="label" x="105" y="230">Arduino Nano</text><text class="small" x="105" y="260">BLE peripheral</text><text class="pin" x="260" y="345">A0</text><text class="pin" x="260" y="445">A1</text>
  <path class="power" d="M400 160H1060M400 535H1060"/><text class="small" x="1070" y="166">5 V</text><text class="small" x="1070" y="541">GND</text>
  <g><path class="wire" d="M560 160V205"/><rect class="sensor" x="445" y="205" width="230" height="82" rx="41"/><text class="label" x="493" y="239">Palm FSR</text><text class="small" x="493" y="266">rating taps</text><path class="wire" d="M560 287V345H325M560 345V370"/><circle class="node" cx="560" cy="345" r="7"/><rect class="resistor" x="510" y="370" width="100" height="60" rx="5"/><text class="pin" x="527" y="407">4.7 kΩ</text><path class="wire" d="M560 430V535"/><text class="small" x="450" y="575">rating channel · A0</text></g>
  <g><path class="wire" d="M865 160V205"/><rect class="sensor" x="750" y="205" width="230" height="82" rx="41"/><text class="label" x="788" y="239">Dorsal FSR</text><text class="small" x="788" y="266">confirm selection</text><path class="wire" d="M865 287V445M325 445H545M575 445H865M865 445V469"/><circle class="node" cx="865" cy="445" r="7"/><rect class="resistor" x="815" y="469" width="100" height="64" rx="5"/><text class="pin" x="832" y="507">4.7 kΩ</text><path class="wire" d="M865 533V535"/><text class="small" x="755" y="575">confirm channel · A1</text></g>
  <rect x="338" y="610" width="700" height="60" rx="6" fill="#e1ebe7" stroke="#79908b" stroke-width="2"/><text class="small" x="370" y="635">GESTURE GRAMMAR</text><text class="label" x="565" y="644">count → confirm → BLE transmit</text>
</svg>
